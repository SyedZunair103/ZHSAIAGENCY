<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060a" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.svg" sizes="any" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#3b82f6" />
    <title>ZHS AI Agency</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ZHS AI Agency",
      "url": "https://zhsaiagency.com",
      "logo": "https://zhsaiagency.com/logo.svg",
      "description": "Premium AI technology agency specializing in custom AI engineering, automation, software development, creative production, and 3D experiences.",
      "email": "zhsaiagency@gmail.com",
      "knowsLanguage": ["en"],
      "areaServed": "US"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ZHS AI Agency",
      "url": "https://zhsaiagency.com"
    }
    </script>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("zhs-theme");
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          if (t === "light") root.classList.add("light");
          else root.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
